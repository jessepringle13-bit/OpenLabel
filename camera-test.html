<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>OpenLabel camera test</title><style>
:root{color-scheme:light}body{margin:0;padding:18px;font:15px/1.5 system-ui,-apple-system,sans-serif;background:#F8F6F0;color:#26332F}h1{font-size:22px;margin:0 0 4px;color:#315B50}p{margin:6px 0}button{display:block;width:100%;min-height:50px;margin:10px 0;border:0;border-radius:14px;background:#477969;color:#FFFEFA;font:inherit;font-weight:700}button.alt{background:#E1ECE6;color:#315B50}video{width:100%;max-height:45vh;border-radius:16px;background:#26332F;margin-top:8px}pre{white-space:pre-wrap;word-break:break-word;background:#FFFEFA;border:1px solid #d6e1d9;border-radius:14px;padding:12px;font-size:13px}
</style></head><body><h1>OpenLabel camera test</h1><p>Tap a button, then copy or screenshot the results box and send it back.</p>
<button id="a">Test rear camera</button><button id="b" class="alt">Test any camera</button><video id="v" playsinline muted autoplay hidden></video><pre id="out">Loading...</pre>
<script>
(()=>{const out=document.getElementById('out'),v=document.getElementById('v');const info={};
function show(extra){out.textContent=Object.entries({...info,...extra}).map(([k,x])=>k+': '+x).join('\n')}
info.url=location.href;info.secureContext=String(window.isSecureContext);info.topLevel=String(window.top===window.self);info.hasMediaDevices=String(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));info.userAgent=navigator.userAgent;info.standalone=String(!!navigator.standalone);info.permissionsApi=navigator.permissions?'available':'not available';show({});
if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'camera'}).then(r=>{info.cameraPermissionState=r.state;show({})}).catch(e=>{info.cameraPermissionState='query failed: '+e.name;show({})})}
if(navigator.mediaDevices&&navigator.mediaDevices.enumerateDevices){navigator.mediaDevices.enumerateDevices().then(d=>{info.videoInputsBeforePermission=d.filter(x=>x.kind==='videoinput').length;show({})}).catch(()=>{})}
async function run(c,label){show({lastTest:label+' (requesting...)'});try{const s=await navigator.mediaDevices.getUserMedia(c);v.hidden=false;v.srcObject=s;await v.play();show({lastTest:label,result:'SUCCESS: camera started',tracks:s.getVideoTracks().map(t=>t.label||'unnamed').join(', ')})}catch(e){show({lastTest:label,result:'FAILED',errorName:e&&e.name,errorMessage:e&&e.message})}}
document.getElementById('a').onclick=()=>run({video:{facingMode:{ideal:'environment'}},audio:false},'rear camera');
document.getElementById('b').onclick=()=>run({video:true,audio:false},'any camera');
})();
</script></body></html>

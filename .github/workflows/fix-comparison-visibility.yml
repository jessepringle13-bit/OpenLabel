name: Fix comparison visibility with real Library tab checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-comparison-visibility.yml', 'library-comparison-visibility.js']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-comparison-visibility
  cancel-in-progress: false
jobs:
  fix:
    if: github.repository == 'jessepringle13-bit/OpenLabel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare guarded page connection and tab fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check library-comparison-visibility.js
          node tests/product-comparison.test.cjs
          node tests/saved-food-comparison.test.cjs
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();anchor='<script src="saved-food-comparison.js?v=20261025-savedcompare2"></script>'
          assert s.count(anchor)==1 and 'library-comparison-visibility.js' not in s,'Comparison connection changed; review before modifying'
          p.write_text(s.replace(anchor,anchor+'<script src="library-comparison-visibility.js?v=20261025-savedvisibility1"></script>',1))
          start='''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><section id="library"><div>Library fixture</div><div id="savedArea"></div><div id="historyArea"></div><div class="lb-actions"></div><div class="lb-changes"></div></section><script>localStorage.setItem('openlabel-calm-dock-v1',JSON.stringify({saved:[],history:[],live:{}}));</script><script src="product-comparison.js"></script><script src="comparison-ui.js"></script>'''
          for order,scripts in [('early','<script src="saved-food-comparison.js"></script><script src="tabs.js"></script>'),('late','<script src="tabs.js"></script><script src="saved-food-comparison.js"></script>')]:
           Path('__comparison-visibility-'+order+'.html').write_text(start+scripts+'<script src="library-comparison-visibility.js"></script></body></html>')
          PY
      - name: Browser-test actual tab CSS, load order and app navigation
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/visibility-browsers"
          npm install --prefix "$RUNNER_TEMP/visibility-test" playwright
          "$RUNNER_TEMP/visibility-test/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/visibility-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/visibility-test/node_modules" node <<'JS'
          const assert=require('node:assert/strict'),{chromium}=require('playwright');(async()=>{const browser=await chromium.launch();try{for(const viewport of [{width:390,height:844},{width:1280,height:900}]){const context=await browser.newContext({viewport});try{const p=await context.newPage();await p.route('**/*',r=>new URL(r.request().url()).origin==='http://127.0.0.1:8765'?r.continue():r.abort());for(const order of ['early','late']){await p.goto('http://127.0.0.1:8765/__comparison-visibility-'+order+'.html');await p.waitForFunction(()=>window.OLLibraryTabs&&window.OLSavedFoodComparison&&window.OLComparisonVisibility);const panel=p.locator('#olSavedFoodComparison');assert.equal(await panel.isVisible(),false);await p.locator('.lb-tabs [data-t="saved"]').click();await panel.waitFor({state:'visible'});assert.equal(await panel.count(),1);await panel.locator(':scope > summary').click();assert.match(await panel.innerText(),/0 eligible saved food/);await p.evaluate(()=>{window.detachedComparisonStyle=document.getElementById('olComparisonVisibilityStyle');detachedComparisonStyle.remove()});assert.equal(await panel.isVisible(),false);await p.evaluate(()=>document.head.append(detachedComparisonStyle));await panel.waitFor({state:'visible'});for(const tab of ['recent','changes']){await p.locator('.lb-tabs [data-t="'+tab+'"]').click();assert.equal(await panel.isVisible(),false)}await p.locator('.lb-tabs [data-t="saved"]').click();await panel.waitFor({state:'visible'});assert.equal(await panel.count(),1)}await p.evaluate(()=>localStorage.clear());await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.OLComparisonVisibility&&window.OLLibraryTabs&&window.OLSavedFoodComparison&&window.OLExploreTabs,{timeout:60000});if(await p.locator('#closeSheet').isVisible())await p.locator('#closeSheet').click();await p.locator('.nav-pill[data-go="library"]').click();await p.locator('#library .lb-tabs [data-t="saved"]').click();await p.locator('#olSavedFoodComparison > summary').waitFor({state:'visible'});await p.locator('#library .lb-tabs [data-t="recent"]').click();assert.equal(await p.locator('#olSavedFoodComparison').isVisible(),false);console.log(JSON.stringify({viewport,actualLibraryTabCss:'passed',bothLoadOrders:'passed',emptySavedState:'visible on Saved',appSavedNavigation:'passed',scope:'Local Chromium; deployment and physical-phone retest remain pending'}))}finally{await context.close()}}}finally{await browser.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit page connection only after browser checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Show comparison panel in Saved while preserving Library tabs'
          git push origin HEAD:main
          echo "Visibility connection: $(git rev-parse HEAD). Actual tab CSS and both script-load orders passed in local Chromium. Deployment and phone retest remain pending." >> "$GITHUB_STEP_SUMMARY"

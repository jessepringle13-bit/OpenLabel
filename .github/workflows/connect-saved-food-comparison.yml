name: Connect saved food comparison candidates after browser checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-saved-food-comparison.yml', '.github/scripts/comparison_wiring.py', 'tests/comparison_wiring_test.py', 'saved-food-comparison.js', 'tests/saved-food-comparison.test.cjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-saved-food-comparison
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'jessepringle13-bit/OpenLabel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test candidate selection and prepare guarded page wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check product-comparison.js
          node --check comparison-ui.js
          node --check saved-food-comparison.js
          node tests/product-comparison.test.cjs
          node tests/saved-food-comparison.test.cjs
          python3 tests/comparison_wiring_test.py
          python3 .github/scripts/comparison_wiring.py
          python3 <<'PY'
          from pathlib import Path
          fixture='''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><section id="library"><h2>Saved</h2><div id="savedArea"></div></section><script>window.fixtureState={saved:['a','b','supplement'],history:[],live:{a:{id:'a',code:'012345678905',live:true,name:'Fictional food A',brand:'Example A',category:'Food'},b:{id:'b',code:'036000291452',live:true,name:'Fictional food B',brand:'Example B',category:'Food'},supplement:{id:'supplement',code:'012345678905',live:true,name:'Fictional supplement',brand:'Example S',category:'Supplements'}}};localStorage.setItem('openlabel-calm-dock-v1',JSON.stringify(fixtureState));window.fixtureSavedSnapshot=localStorage.getItem('openlabel-calm-dock-v1');</script><script src="product-comparison.js"></script><script src="comparison-ui.js"></script><script src="saved-food-comparison.js"></script></body></html>'''
          Path('__saved-food-comparison-probe.html').write_text(fixture)
          PY
      - name: Browser-check saved-food selection and Library connection
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/saved-compare-browsers"
          npm install --prefix "$RUNNER_TEMP/saved-compare-test" playwright
          "$RUNNER_TEMP/saved-compare-test/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/saved-compare-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/saved-compare-test/node_modules" node <<'JS'
          const assert=require('node:assert/strict'),{chromium}=require('playwright');(async()=>{const browser=await chromium.launch();try{for(const viewport of [{width:390,height:844},{width:1280,height:900}]){const context=await browser.newContext({viewport});try{const p=await context.newPage();await p.route('**/*',r=>new URL(r.request().url()).origin==='http://127.0.0.1:8765'?r.continue():r.abort());await p.goto('http://127.0.0.1:8765/__saved-food-comparison-probe.html');await p.locator('#olSavedFoodComparison').waitFor();await p.locator('#olSavedFoodComparison > summary').click();const selects=p.locator('.ol-comparison-picker select');assert.equal(await selects.count(),3);assert.equal(await selects.nth(0).locator('option').count(),3);assert(!/Fictional supplement/.test(await selects.nth(0).textContent()));await selects.nth(0).selectOption('a');await selects.nth(1).selectOption('b');assert.equal(await p.locator('.ol-comparison-picker button').isDisabled(),true);assert.match(await p.locator('.ol-comparison-picker [role=status]').textContent(),/adapter is not connected/);assert.equal(await p.evaluate(()=>localStorage.getItem('openlabel-calm-dock-v1')===fixtureSavedSnapshot),true);await p.evaluate(()=>{fixtureState.saved=['a'];localStorage.setItem('openlabel-calm-dock-v1',JSON.stringify(fixtureState));OLSavedFoodComparison.refresh()});assert.equal(await selects.nth(0).locator('option').count(),2);assert.equal(await selects.nth(1).inputValue(),'');assert.equal(await p.locator('.ol-comparison-picker').count(),1);await p.evaluate(()=>{localStorage.setItem('openlabel-calm-dock-v1','{bad json');OLSavedFoodComparison.refresh()});assert.equal(await selects.nth(0).locator('option').count(),1);assert.equal(await p.locator('.ol-comparison-picker button').isDisabled(),true);await p.evaluate(()=>localStorage.clear());await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.OLSavedFoodComparison&&window.OLComparisonUI&&window.OLProductComparison&&window.OLExploreTabs,{timeout:60000});if(await p.locator('#closeSheet').isVisible())await p.locator('#closeSheet').click();await p.locator('.nav-pill[data-go="library"]').click();await p.locator('#olSavedFoodComparison > summary').waitFor({state:'visible'});assert.equal(await p.locator('#olSavedFoodComparison').count(),1);console.log(JSON.stringify({viewport,savedCandidateSelection:'passed',readOnlyStorage:'passed in fixture',libraryConnection:'passed',scope:'No live nutrition adapter or comparison; not deployed-site or physical-phone verification'}))}finally{await context.close()}}}finally{await browser.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit page wiring only after checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if git diff --cached --quiet -- index.html; then
            echo "Comparison page wiring already present; no commit needed. Browser checks passed in this run; deployment and phone checks remain pending." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'Wire saved food candidates into the comparison picker'
            git push origin HEAD:main
            echo "Saved-picker connection: $(git rev-parse HEAD). Browser checks passed in this run; live nutrition, deployment and phone checks remain separate." >> "$GITHUB_STEP_SUMMARY"
          fi

        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re,subprocess
          V='20261024-bvitamins6'
          changes={
          'index.html':[('src="evidence.js?v=20261024-magnesium5"','src="evidence.js?v='+V+'"')],
          'evidence.js':[("sc.src='result.js?v=20261024-magnesium5';","sc.src='result.js?v="+V+"';")],
          'result.js':[("f==='ingredient-loader.js'?'20261024-magnesium5'","f==='ingredient-loader.js'?'"+V+"'")],
          'ingredient-loader.js':[("var V='20261024-magnesium5'","var V='"+V+"'"),('"magnesium-forms.js","learn-search.js"','"magnesium-forms.js","folate-b12-forms.js","learn-search.js"')],
          'learn-search.js':[('return root.OLMagnesiumForms?root.OLMagnesiumForms.catalog(entries):entries}', 'if(root.OLMagnesiumForms)entries=root.OLMagnesiumForms.catalog(entries);return root.OLBVitaminForms?root.OLBVitaminForms.catalog(entries):entries}')]

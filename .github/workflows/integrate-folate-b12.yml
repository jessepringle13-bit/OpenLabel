          const assert=require('node:assert/strict'),m=require('./folate-b12-forms.js'),a=m.create();assert.equal(a.catalog([]).length,8);assert.equal(new Set(a.catalog([]).map(e=>e.id)).size,8);for(const r of m.batch.records){for(const n of r.exact_label_terms)assert.equal(a.lookup(n).batchRecord,r);for(const c of Object.values(a.lookup(r.exact_label_terms[0]).record))assert.ok(m.batch.references[c[1]])}assert.equal(a.lookup('Folate (L-5-MTHF)').batchRecord.id,'methylfolate');assert.equal(a.lookup('Vitamin B12 (as Methylcobalamin)').batchRecord.id,'methylcobalamin');for(const n of ['Folic acid (as L-5-MTHF)','Folate (as Methylcobalamin)','Vitamin B12 (as Folic Acid)','Methylcobalamin (as Cyanocobalamin)','calcium L-5-MTHF','Quatrefolic'])assert.equal(a.lookup(n),null);assert.equal(a.lookup('folate').batchRecord.form_classification,'not determined');assert.equal(a.lookup('vitamin b12').batchRecord.form_classification,'not determined');assert.equal(a.catalog(a.catalog([])).length,8);assert.equal(a.catalog([{id:'thorne-6',title:'Folate (L-5-MTHF)'}]).length,9);console.log('Folate/B12 exact-term, generic uncertainty, source and contradiction checks passed.');

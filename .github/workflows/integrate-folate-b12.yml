name: Integrate folate and B12 form education
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-folate-b12.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: integrate-folate-b12
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'jessepringle13-bit/OpenLabel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare guarded folate and B12 integration

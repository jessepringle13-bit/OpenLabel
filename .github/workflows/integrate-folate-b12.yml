      - name: Browser-check vitamin entries and existing coverage
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/bvit-browsers"
          npm install --prefix "$RUNNER_TEMP/bvit-test" playwright
          "$RUNNER_TEMP/bvit-test/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/bvit-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/bvit-test/node_modules" node <<'JS'
          const assert=require('node:assert/strict'),{chromium}=require('playwright');(async()=>{const browser=await chromium.launch({args:['--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});try{for(const viewport of [{width:390,height:844},{width:1280,height:900}]){const context=await browser.newContext({viewport,permissions:['camera']});try{const p=await context.newPage();p.setDefaultTimeout(30000);await p.route('**/*',r=>new URL(r.request().url()).origin==='http://127.0.0.1:8765'?r.continue():r.abort());await p.goto('http://127.0.0.1:8765/?v=20261024-bvitamins6',{waitUntil:'domcontentloaded'});if(await p.locator('#closeSheet').isVisible())await p.locator('#closeSheet').click();await p.locator('.nav-pill[data-go="explore"]').click();await p.locator('#ol-explore-tab-learn').waitFor({timeout:60000});await p.locator('#ol-explore-tab-learn').click();await p.locator('#exploreSearch').fill('folate b12 forms');await p.waitForFunction(()=>window.OLBVitaminForms&&document.querySelectorAll('.learn-row').length===8);const rows=await p.evaluate(()=>OLBVitaminForms.catalog([]).map(e=>({title:e.title,label:e.batchRecord.exact_label_terms[0]})));for(const r of rows){await p.locator('.learn-row').getByText(r.title+' ›',{exact:true}).click();const box=p.locator('.ol-inline-detail > .learn-dialog');await box.waitFor({state:'visible'});await p.waitForFunction(()=>{const b=document.querySelector('.ol-inline-detail > .learn-dialog');return b&&b.querySelector('.olui-footer p')&&getComputedStyle(b.querySelector('.olui-footer p')).fontSize==='12px'&&b.querySelectorAll('details.olui-accordion').length>=2});const ds=box.locator('details.olui-accordion');await ds.nth(0).locator(':scope > summary').click();await ds.nth(1).locator(':scope > summary').click();await p.waitForFunction(()=>{const d=document.querySelectorAll('.learn-dialog details.olui-accordion');return !d[0].open&&d[1].open});await p.getByRole('button',{name:/Back to Learn/}).click();await box.waitFor({state:'hidden'})}await p.locator('#exploreSearch').fill('thorne');await p.waitForFunction(()=>document.querySelectorAll('.learn-row').length===29);assert.equal(await p.evaluate(()=>OLMagnesiumForms.catalog([]).length),16);if(viewport.width===390){for(const name of rows.map(r=>r.label).concat(['Folate (L-5-MTHF)','Vitamin B12 (as Methylcobalamin)'])){await p.evaluate(name=>{const n=document.createElement('div');n.id='bvit-test';n.style.paddingBottom='200px';n.append(OLIngredients.render(name));document.body.append(n)},name);await p.locator('#bvit-test .ol-ing-row').first().click();await p.waitForFunction(()=>document.querySelector('.ol-ing-sheet .bvit-form-context')&&document.querySelector('.ol-ing-sheet .olui-footer'));assert.ok(await p.locator('.bvit-form-context a').count());const previous=p.locator('.ol-ing-sheet .thorne-context');if(await previous.count())assert.equal(await previous.isVisible(),false);await p.locator('.ol-ing-close').click();await p.locator('#bvit-test').evaluate(n=>n.remove())}}console.log(JSON.stringify({viewport,vitaminEntries:8,thorneEntries:29,magnesiumEntries:16,status:'passed',scope:'Local Chromium only; not deployed-site or physical-phone verification'}));}finally{await context.close()}}}finally{await browser.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit only after checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html evidence.js result.js ingredient-loader.js learn-search.js folate-b12-forms.js docs/folate-b12-forms.json
          git diff --cached --stat
          git commit -m 'Integrate folate and B12 forms into education views'
          git push origin HEAD:main
          echo "Integration commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Request branch-based Pages rebuild when applicable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$kind" = "legacy" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
            echo 'Rebuild requested; deployment and phone verification remain open.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Integration committed; verify existing Pages deployment separately.'
          fi

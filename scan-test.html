<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenLabel scan test</title><style>body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#F8F6F0;color:#26332F;padding:14px}button{font:inherit;padding:12px 16px;border:0;border-radius:12px;background:#477969;color:#fff;margin:4px 4px 4px 0}video{width:100%;max-height:38vh;background:#000;border-radius:12px;object-fit:cover}#log{white-space:pre-wrap;background:#fff;border:1px solid #d6e1d9;border-radius:12px;padding:10px;font:12px/1.45 ui-monospace,monospace;margin-top:10px}#found{font-size:20px;font-weight:700;color:#315B50;margin:8px 0}</style></head><body><h2>OpenLabel scan test</h2><button id="start">1. Start camera + barcode test</button><button id="ocr">2. Test digit reader</button><div id="found"></div><video id="v" playsinline muted autoplay></video><div id="log"></div><script>
(()=>{const $=s=>document.querySelector(s),L=$('#log'),t0=Date.now();function log(m){L.textContent+=((Date.now()-t0)/1000).toFixed(1)+'s  '+m+'\n'}
const ZB='https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js',PO='https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.21/dist/index.js',TE='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script failed to load: '+src));document.head.append(s)})}
log('secure context: '+window.isSecureContext);log('native BarcodeDetector: '+('BarcodeDetector' in window));log('UA: '+navigator.userAgent);
let stream=null,video=$('#v'),det=null,running=false;
$('#start').onclick=async()=>{try{if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();log('camera OK '+video.videoWidth+'x'+video.videoHeight)}}catch(e){log('CAMERA ERROR '+e.name+': '+e.message);return}
try{if(!det){let native=false;try{if(window.BarcodeDetector){const f=await BarcodeDetector.getSupportedFormats();log('native formats: '+f.join(','));if(f.length){det=new BarcodeDetector({formats:f.filter(x=>['ean_13','ean_8','upc_a','upc_e'].includes(x))});native=true;log('using NATIVE detector')}}}catch(e){log('native check failed: '+e.message)}
if(!native){log('loading zbar...');await load(ZB);log('zbar script OK');log('loading polyfill...');await load(PO);log('polyfill script OK; global: '+typeof window.barcodeDetectorPolyfill);det=new window.barcodeDetectorPolyfill.BarcodeDetectorPolyfill({formats:['ean_13','ean_8','upc_a','upc_e']});log('using POLYFILL detector')}}}catch(e){log('DETECTOR SETUP ERROR '+(e&&e.message||e));return}
if(running)return;running=true;let n=0,errs=0;log('scanning... hold a barcode steady in view');const tick=async()=>{try{n++;const r=await det.detect(video);if(r.length){$('#found').textContent='FOUND: '+r[0].rawValue+' ('+r[0].format+')';log('FOUND '+JSON.stringify(r.map(x=>[x.rawValue,x.format])))}else if(n%10===0)log('frames tried: '+n+', nothing found yet')}catch(e){if(++errs<=3)log('DETECT ERROR '+(e&&e.message||e))}setTimeout(tick,400)};tick()};
$('#ocr').onclick=async()=>{try{if(!video.videoWidth){log('start the camera first (button 1)');return}log('loading Tesseract...');if(!window.Tesseract)await load(TE);log('Tesseract script OK; creating worker (first time downloads language data, can take 10-20 s)...');const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_char_whitelist:'0123456789 ',tessedit_pageseg_mode:'11'});log('worker ready; reading center band...');const vw=video.videoWidth,vh=video.videoHeight,c=document.createElement('canvas');c.width=vw*0.8;c.height=vh*0.36;c.getContext('2d').drawImage(video,vw*0.1,vh*0.3,c.width,c.height,0,0,c.width,c.height);const r=await w.recognize(c);log('OCR TEXT: '+JSON.stringify(r.data.text))}catch(e){log('OCR ERROR '+(e&&e.message||e))}};
})();
</script></body></html>
